name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first: it generates the route types that typecheck needs.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
