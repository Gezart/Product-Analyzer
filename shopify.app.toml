# Shopify app configuration — https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration
# `shopify app config link` fills client_id for your app; `shopify app dev` updates the URLs to its tunnel.
client_id = "ee40714e951a9ecee7b580a54addbd81"
name = "Unstuck: Product Analyzer"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# Keep in sync with SHOPIFY_SCOPES in .env.example.
scopes = "read_products,write_products,read_inventory,read_orders,read_reports,read_returns,write_app_proxy"
# Shopify-managed install: the app gets its token by token exchange, no OAuth redirect.
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://example.com/api/auth"]

# The storefront's blocks call the app at /apps/unstuck/… on the shop's domain; Shopify forwards the
# calls to /api/proxy with a signature (checked in src/lib/app-proxy.js).
[app_proxy]
url = "/api/proxy"
prefix = "apps"
subpath = "unstuck"

# App-owned metafields: only this app can write them; the theme app extension reads them in Liquid
# through the $app prefix (product.metafields["$app"].…, shop.metafields["$app"].…).
[shop.metafields.app.page_builder]
name = "Unstuck page builder"
description = "Which blocks show on product pages, in which order, with their settings."
type = "json"
access.admin = "merchant_read"

[product.metafields.app.bought_together]
name = "Unstuck: often bought together"
description = "Products often bought with this one, from the store's orders."
type = "list.product_reference"
access.admin = "merchant_read"

[product.metafields.app.ab_test]
name = "Unstuck A/B test"
description = "The running A/B test's version B for this product."
type = "json"
access.admin = "merchant_read"

[webhooks]
api_version = "2026-10"

  # Mandatory privacy webhooks (App Store requirement). App, order, product and inventory topics are
  # registered per shop by the app itself after install (src/lib/sync/webhooks.js).
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/api/webhooks"

[pos]
embedded = false
